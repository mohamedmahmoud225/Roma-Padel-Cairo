<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Roma Padel Cairo</title>
    <style>
        :root { --roma-green: #008C45; --roma-dark: #0a192f; --roma-gold: #d4af37; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 1300px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 15px; border-bottom: 3px solid var(--roma-green); padding-bottom: 10px; }
        textarea.main-input { width: 100%; height: 90px; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; margin-bottom: 10px; resize: none; }
        .btn-process { background: var(--roma-green); color: white; border: none; width: 100%; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-bottom: 20px; }
        
        .copy-layout { display: flex; gap: 10px; margin-bottom: 20px; }
        .copy-box { background: #fff; border: 1px solid #ddd; border-radius: 8px; display: flex; flex-direction: column; flex: 1; }
        .box-header { padding: 8px; background: #fafafa; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .box-header span { font-weight: bold; font-size: 11px; color: var(--roma-dark); }
        .result-area { width: 100%; height: 280px; border: none; padding: 10px; font-family: 'Courier New', monospace; font-size: 12px; white-space: pre; overflow: auto; line-height: 1.8; outline: none; box-sizing: border-box; }
        .btn-copy { background: var(--roma-dark); color: white; border: none; padding: 3px 7px; border-radius: 3px; cursor: pointer; font-size: 9px; }

        .totals-section { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .total-card { padding: 15px; border-radius: 8px; text-align: center; color: white; font-weight: bold; }
        .cash-bg { background: #2c3e50; }
        .insta-bg { background: #2980b9; }
        .grand-bg { background: var(--roma-green); }
    </style>
</head>
<body>

<div class="container">
    <div class="header"><h1 style="margin:0; font-size:18px;">ROMA PADEL - 4-SECTION SYSTEM</h1></div>
    <textarea id="smartInput" class="main-input" placeholder="الصق بيانات الحجوزات هنا..."></textarea>
    <button class="btn-process" onclick="processData()">Done</button>

    <div class="copy-layout">
        <div class="copy-box" style="flex: 2.5;">
            <div class="box-header"><span>1. Main (Date/Start/End/Hrs)</span><button class="btn-copy" onclick="copyText('mainResult')">Copy</button></div>
            <textarea id="mainResult" class="result-area" readonly></textarea>
        </div>
        <div class="copy-box">
            <div class="box-header"><span>2. Fees (Amount)</span><button class="btn-copy" onclick="copyText('amtResult')">Copy</button></div>
            <textarea id="amtResult" class="result-area" readonly></textarea>
        </div>
        <div class="copy-box">
            <div class="box-header"><span>3. Payment Type</span><button class="btn-copy" onclick="copyText('payResult')">Copy</button></div>
            <textarea id="payResult" class="result-area" readonly></textarea>
        </div>
        <div class="copy-box">
            <div class="box-header"><span>4. Court Type</span><button class="btn-copy" onclick="copyText('courtResult')">Copy</button></div>
            <textarea id="courtResult" class="result-area" readonly></textarea>
        </div>
    </div>

    <div class="totals-section">
        <div class="total-card cash-bg"><span style="font-size:10px;">CASH</span><div id="sumCash">0</div></div>
        <div class="total-card insta-bg"><span style="font-size:10px;">INSTAPAY</span><div id="sumInsta">0</div></div>
        <div class="total-card grand-bg"><span style="font-size:10px;">GRAND TOTAL</span><div id="sumGrand">0</div></div>
    </div>
</div>

<script>
    function processData() {
        const input = document.getElementById('smartInput').value;
        const lines = input.split('\n');
        let dateMatch = input.match(/\d{1,2}\/\d{1,2}\/\d{4}/);
        let activeDate = dateMatch ? dateMatch[0] : "";
        let activeDay = "";
        if(dateMatch) {
            const [d, m, y] = activeDate.split('/');
            activeDay = new Intl.DateTimeFormat('en-US', {weekday: 'long'}).format(new Date(y, m-1, d));
        }

        let mainT = "", amtT = "", payT = "", courtT = "";
        let totalCash = 0, totalInsta = 0;
        let crossedMidnight = false;

        lines.forEach(line => {
            let cl = line.trim().toLowerCase();
            if (cl.includes("from") || cl.includes("من")) {
                let times = cl.match(/\d{1,2}:\d{2}/g);
                if (!times || times.length < 2) return;
                
                let sParts = times[0].split(':').map(Number);
                let eParts = times[1].split(':').map(Number);
                let startMins = sParts[0] * 60 + sParts[1];
                let endMins = eParts[0] * 60 + eParts[1];

                let startPeriod = "PM"; 
                if (crossedMidnight || (sParts[0] >= 1 && sParts[0] < 7)) startPeriod = "AM";

                let diffMins = endMins - startMins;
                if (diffMins <= 0) diffMins += 720; 
                let h = diffMins / 60;
                
                let endPeriod = startPeriod;
                if (endMins < startMins || (sParts[0] == 11 && eParts[0] == 12)) {
                    endPeriod = "AM";
                    crossedMidnight = true;
                }

                let cVal = extractValue(cl, "cash");
                let iVal = extractValue(cl, "insta") || extractValue(cl, "instapay");
                totalCash += cVal; totalInsta += iVal;

                let payType = (cVal > 0 && iVal > 0) ? "Both" : (cVal > 0 ? "Cash" : (iVal > 0 ? "Transfer" : "N/A"));
                let courtType = (cl.includes("single") || cl.includes("solo")) ? "Solo" : "Double";

                mainT += `${activeDate}\t${activeDay}\t${times[0]} ${startPeriod}\t${times[1]} ${endPeriod}\t${h.toFixed(1)}\n`;
                amtT += `${cVal + iVal}\n`;
                payT += `${payType}\n`;
                courtT += `${courtType}\n`;
            }
        });

        document.getElementById('mainResult').value = mainT;
        document.getElementById('amtResult').value = amtT;
        document.getElementById('payResult').value = payT;
        document.getElementById('courtResult').value = courtT;
        document.getElementById('sumCash').innerText = totalCash.toLocaleString();
        document.getElementById('sumInsta').innerText = totalInsta.toLocaleString();
        document.getElementById('sumGrand').innerText = (totalCash + totalInsta).toLocaleString();
    }

    function extractValue(line, key) {
        let regex = new RegExp(`(\\d+)\\s+${key}`);
        let m = line.match(regex);
        if(!m) { regex = new RegExp(`${key}\\s+(\\d+)`); m = line.match(regex); }
        return m ? parseInt(m[1]) : 0;
    }

    function copyText(id) {
        const field = document.getElementById(id);
        field.select();
        document.execCommand('copy');
    }
</script>
</body>
</html>
